name: Update third-party extensions

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:        # "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add new upstream releases to index.xml
        run: python3 tools/update_upstream.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet index.xml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "ReaPack index: new upstream release"
          git push
